name: Deploy to Staging

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

# Default: read-only. Only the publish job gets write access.
permissions:
  contents: read

concurrency:
  group: "pages-staging"
  cancel-in-progress: false

jobs:
  # ── Gate 1-3: Quality Gates (SOP-005) ──────────────────────────────────────
  quality:
    name: Quality Gates (Lint · TypeCheck · Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — Lint (0 warnings allowed)
        run: npm run lint

      - name: Gate 2 — TypeScript strict check
        run: npm run typecheck

      - name: Gate 3 — Security audit (no high/critical CVEs)
        run: npm audit --audit-level=high

  build:
    name: Build Staging
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite (Staging)
        run: npm run build
        env:
          VITE_BASE_PATH: /ams-Audio-Homepage-testing/staging/

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-dist
          path: ./dist
          retention-days: 3

  deploy:
    environment:
      name: staging
      url: https://darkness308.github.io/ams-Audio-Homepage-testing/staging/
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-dist
          path: ./dist

      - name: Deploy to GitHub Pages (Staging)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: staging
          keep_files: false
