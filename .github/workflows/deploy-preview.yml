name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only. This workflow runs the workflow file from the PR, so it never
# gets write access. Publishing happens in preview-publish.yml, which runs
# from the default branch via workflow_run.
permissions:
  contents: read

jobs:
  # ── Gate 1-3: Quality Gates (SOP-005) ──────────────────────────────────────
  quality:
    name: Quality Gates (Lint · TypeCheck · Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — Lint (0 warnings allowed)
        run: npm run lint

      - name: Gate 2 — TypeScript strict check
        run: npm run typecheck

      - name: Gate 3 — Security audit (no high/critical CVEs)
        run: npm audit --audit-level=high

  build:
    name: Build Preview
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite (Preview)
        run: npm run build
        env:
          VITE_BASE_PATH: /ams-Audio-Homepage-testing/pr-${{ github.event.pull_request.number }}/

      - name: Record PR number for the publisher
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > ./pr-number

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dist
          path: |
            ./dist
            ./pr-number
          retention-days: 3
