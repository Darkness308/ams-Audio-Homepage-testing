name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Default: read-only. Only the publish job, which runs no code from the PR,
# gets write access.
permissions:
  contents: read

jobs:
  # ── Gate 1-3: Quality Gates (SOP-005) ──────────────────────────────────────
  quality:
    name: Quality Gates (Lint · TypeCheck · Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — Lint (0 warnings allowed)
        run: npm run lint

      - name: Gate 2 — TypeScript strict check
        run: npm run typecheck

      - name: Gate 3 — Security audit (no high/critical CVEs)
        run: npm audit --audit-level=high

  build:
    name: Build Preview
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite (Preview)
        run: npm run build
        env:
          VITE_BASE_PATH: /ams-Audio-Homepage-testing/pr-${{ github.event.pull_request.number }}/

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dist
          path: ./dist
          retention-days: 3

  publish:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-dist
          path: ./dist

      - name: Deploy to GitHub Pages (Preview)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment PR with Preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://darkness308.github.io/ams-Audio-Homepage-testing/pr-${prNumber}/`;
            
            const comment = `<!-- pr-preview-comment -->
            ## 🚀 Preview Deployment
            
            Your preview deployment is ready!
            
            🔗 **Preview URL**: ${previewUrl}
            
            This preview will be automatically updated when you push new commits to this PR.`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('<!-- pr-preview-comment -->')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
