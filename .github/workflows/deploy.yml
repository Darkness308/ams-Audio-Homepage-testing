name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  # ── Gate 1-3: Quality Gates (SOP-005) ──────────────────────────────────────
  quality:
    name: Quality Gates (Lint · TypeCheck · Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — Lint (0 warnings allowed)
        run: npm run lint

      - name: Gate 2 — TypeScript strict check
        run: npm run typecheck

      - name: Gate 3 — Security audit (no high/critical CVEs)
        run: npm audit --audit-level=high

  # ── Gate 5: Build & Deploy ──────────────────────────────────────────────────
  build:
    name: Build (Production)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 5 — Build with Vite (Production)
        run: npm run build
        env:
          # Custom domain active: base path is "/" (ADR-0005)
          VITE_BASE_PATH: /
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: production
      url: https://www.ams-audio.com
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (Production)
        id: deployment
        uses: actions/deploy-pages@v4
