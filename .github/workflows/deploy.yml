name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Default: read-only. Pages and OIDC rights only in the deploy job.
permissions:
  contents: read

concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  # ── Gate 1-3: Quality Gates (SOP-005) ──────────────────────────────────────
  quality:
    name: Quality Gates (Lint · TypeCheck · Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — Lint (0 warnings allowed)
        run: npm run lint

      - name: Gate 2 — TypeScript strict check
        run: npm run typecheck

      - name: Gate 3 — Security audit (no high/critical CVEs)
        run: npm audit --audit-level=high

  # ── Gate 5: Build & Deploy ──────────────────────────────────────────────────
  build:
    name: Build (Production)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Go-Live-Prüfung (Nachweise, Impressum, Werbeaussagen — ADR-0009)
        run: npm run golive

      - name: Gate 5 — Build with Vite (Production)
        run: npm run build
        env:
          # Custom domain active: base path is "/" (ADR-0005)
          VITE_BASE_PATH: /
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./dist"

  deploy:
    environment:
      name: production
      url: https://www.ams-audio.com
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages (Production)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
