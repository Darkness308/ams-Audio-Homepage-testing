name: Publish PR Preview

# Runs from the default branch (workflow_run), so a pull request cannot change
# this file. It never checks out or runs code from the PR; it only publishes
# the static build output of same-repository PRs.
on:
  workflow_run:
    workflows: ["Deploy PR Preview"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-dist
          path: ./preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The PR number comes from the trusted workflow_run event, never from the
      # PR-controlled artifact; the artifact value must match or the run fails.
      - name: Determine PR number
        id: pr
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No pull request attached to this workflow run" >&2
            exit 1
          fi
          ARTIFACT_PR="$(cat ./preview/pr-number 2>/dev/null || true)"
          if [ "$ARTIFACT_PR" != "$PR_NUMBER" ]; then
            echo "PR number in artifact ($ARTIFACT_PR) does not match the workflow run ($PR_NUMBER)" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages (Preview)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview/dist
          destination_dir: pr-${{ steps.pr.outputs.number }}
          keep_files: true

      - name: Comment PR with Preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const previewUrl = `https://darkness308.github.io/ams-Audio-Homepage-testing/pr-${prNumber}/`;
            const comment = `<!-- pr-preview-comment -->
            ## Preview Deployment

            Preview URL: ${previewUrl}

            The preview is updated with every push to this PR.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('<!-- pr-preview-comment -->')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }
