<!-- @dsCard height=288 width=960 -->
<div class="cover">
  <svg class="art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: on color-bg — color-stone-800 slab 224×288 (bleeds top/bottom), color-text-strong 168×112 (flips with the theme: stone-100 tone in dark, near-black in light, so it never vanishes on the light ground), color-stone-500 80×96, color-stone-300 pill 72×96
      arrangement: one tall slab with three satellites, right of x=480, gaps of space-4 (16px)
      pattern: literal motif (sound ripples) — concentricExpand rings from the homepage, drawn as four color-stone-400 arcs at space-12 pitch from the slab's lower-left corner (clipped to the slab, so they read the same in both themes)
      steps/radii: space-4 gaps, space-8 inset, arc pitch 48px (space-12); radius-3xl slab, radius-2xl tiles, radius-full pill
      text: name in color-text, tagline in color-text-muted (weight 400, Typo-Regeln v2)
    -->
    <defs><clipPath id="slab"><rect x="520" y="-24" width="224" height="336" class="r3"/></clipPath></defs>
    <rect x="520" y="-24" width="224" height="336" class="b-slab r3"/>
    <g clip-path="url(#slab)" class="arc">
      <circle cx="520" cy="288" r="48"/><circle cx="520" cy="288" r="96"/>
      <circle cx="520" cy="288" r="144"/><circle cx="520" cy="288" r="192"/>
    </g>
    <rect x="760" y="32" width="168" height="112" class="b-light r2"/>
    <rect x="760" y="160" width="80" height="96" class="b-mid r2"/>
    <rect x="856" y="160" width="72" height="96" rx="36" class="b-soft"/>
  </svg>
  <div class="text">
    <div class="name">AMS Audio</div>
    <div class="tag">360° Akustik-Kompetenz.</div>
  </div>
</div>
<style>
  body { margin: 0; background: var(--color-bg); }
  .cover { position: relative; width: 960px; height: 288px; background: var(--color-bg); overflow: hidden; }
  .art { position: absolute; inset: 0; }
  .b-slab { fill: var(--color-stone-800); }
  .b-light { fill: var(--color-text-strong); }
  .b-mid { fill: var(--color-stone-500); }
  .b-soft { fill: var(--color-stone-300); }
  .r3 { rx: var(--radius-3xl); }
  .r2 { rx: var(--radius-2xl); }
  .arc circle { fill: none; stroke: var(--color-stone-400); stroke-width: 1; }
  .text { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .name { font: 200 80px/0.95 var(--font-sans); letter-spacing: -0.025em; color: var(--color-text); }
  .tag { margin-top: 16px; font: 400 14px/20px var(--font-sans); color: var(--color-text-muted); }
</style>
